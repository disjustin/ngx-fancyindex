<!DOCTYPE html>
<html lang="en" class="theme-light spacing-normal">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Nginx directory listing with search, sorting, and theme support">
        <meta name="color-scheme" content="light dark">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; worker-src 'self';">
        <title>Nginx Directory</title>
        <script>
        (function () {
            var d = document.documentElement, t, s;
            try {
                t = localStorage.getItem('fancyindex-theme');
                s = localStorage.getItem('fancyindex-spacing');
            } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (s !== 'compact' && s !== 'comfortable') {
                s = 'normal';
            }
            d.className = 'theme-' + t + ' spacing-' + s;
            d.style.colorScheme = t;
        }());
        </script>
        <link rel="stylesheet" href="/_nfi_theme/styles.css">
    </head>
<body>
